name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install fastapi httpx pytest chromadb python-dotenv openai
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t arxiv-rag .
      - name: Container starts and answers /health
        run: |
          docker run -d -p 8000:8000 --name api arxiv-rag
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
